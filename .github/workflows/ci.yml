name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: flourishive_test
          MARIADB_USER: flourishive
          MARIADB_PASSWORD: flourishive_dev
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @flourishive/backend test:e2e

  desktop:
    name: Desktop (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System packages (software token for the signing tests, libraries Qt needs headless)
        run: sudo apt-get update && sudo apt-get install -y softhsm2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --locked
      - run: uv run python -c "import flourishive_desktop, pyhanko"
      - name: Tests (signing through a software token, the screens, the API client)
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
