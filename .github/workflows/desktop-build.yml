name: Desktop build

# Builds the UNSIGNED Flourishive Desktop for Windows and macOS (D-51: nothing bought yet) and keeps it as a
# downloadable file on the run page. Windows shows "unknown publisher"; macOS needs right-click, Open.
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Build
        run: ./packaging/build.sh
      - name: Start-up check (loads everything, draws a window off screen, exits)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe="dist/FlourishiveDesktop/FlourishiveDesktop.exe"; else exe="dist/FlourishiveDesktop/FlourishiveDesktop"; fi
          QT_QPA_PLATFORM=offscreen "$exe" --selftest
      - name: Zip
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../FlourishiveDesktop-windows.zip FlourishiveDesktop; else ditto -c -k --sequesterRsrc --keepParent FlourishiveDesktop.app ../FlourishiveDesktop-macos.zip; fi
      - uses: actions/upload-artifact@v4
        with:
          name: FlourishiveDesktop-${{ runner.os }}
          path: desktop/FlourishiveDesktop-*.zip
          retention-days: 30
