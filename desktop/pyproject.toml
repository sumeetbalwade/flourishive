[project]
name = "flourishive-desktop"
version = "0.1.0"
description = "Flourishive Desktop: signs approved letters with the signatory's USB certificate token"
readme = "README.md"
authors = [
    { name = "Sumeet Balwade", email = "41995680+sumeetbalwade@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "platformdirs>=4.14.8",
    "pyhanko[pkcs11]>=0.38.1",
    "pyside6-essentials>=6.8",
]

[project.scripts]
flourishive-desktop = "flourishive_desktop.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
